# The cascade, trained component by component. Every modelling choice is a key here, with why it was
# made and what the alternatives are. Outputs land in cascade/results/<name>/.
#
#   stage 1      poisson | clustered | repulsive      trained on ALL bank clouds (it is the filter)
#   stage 2      clustered: thomas | nested | lgcp | reject   trained on those families' clouds IN REGIME,
#                repulsive: matern2 | reject                  plus reject examples; reject -> poisson
#   stage 3      one regressor per family             trained on that family's clouds IN REGIME
#                poisson: nbar_hat = n                no model
#
# No component sees another component's predictions while training. "In regime" is a frozen rule on
# the bank's parameters (cutoffs.json from cascade/regime_analysis.py, see `regime:` below); the
# components are only put together afterwards, by cascade/pipeline.py. How to run: cascade/README.md.

name: default

# Class prior (stage 1 weights and scores; stage 2's families get equal weight the same way).
#   balanced_groups: poisson / clustered / repulsive 1/3 each, split evenly over a group's families.
prior: balanced_groups

# Features for the tree/linear models: cascade/features.py (111 classical summary-function samples
# + log n). Networks take their own input, set per entry of `models:`.
features: classical

stage1:
  model: hgb                    # hgb | logreg | nn (GPU: stage1_nn.py). hgb, logreg and the curves
                                # network tie at ~0.795 (stage1.py compare); hgb is the default.
  # Out-of-fold predictions on the train split (folds grouped by theta). The regime analysis
  # fits the cutoffs on these -- 370k held-out routing decisions -- so the test set never picks them.
  crossfit_folds: 5
  nn_model: nn                  # which `models:` entry stage1_nn.py trains when model: nn

regime:
  # Whose stage-1 routing defines the cutoffs: results/<source_run>/regime_analysis/cutoffs.json.
  source_run: default
  # One coordinate per family; the cutoff is on coordinate * nbar^a with `a` fitted (regime.py), i.e.
  # the 2-D (coordinate, nbar) boundary. Chosen by the regime analysis (summary.md):
  #   thomas omega (cluster overlap), nested omega_inner, matern2 zeta, lgcp zeta.
  # Any regime.DERIVED name or manifest column works (e.g. delta_tilde).
  coordinates: {thomas: omega, nested: omega_inner, matern2: zeta, lgcp: zeta}
  # A component trains on the clouds where stage 1's fitted P(routed to own group) >= tau.
  # 0 = no filtering, the baseline the filter has to beat.
  taus: [0, 0.3, 0.5, 0.7, 0.9]

stage2:                         # the group classifiers: clustered (thomas | nested | lgcp), repulsive (matern2)
  models: [hgb, nn, perslay_z_rips, perslay_z_alpha_diameter, perslay_z_dtm_k5, perslay_z_dtm_k10,
           perslay_z_dtm_k15, perslay_z_dtm_k20]
  # A `reject` class that re-routes to poisson (nbar_hat = n): stage 1 lets near-CSR clouds through
  # (9% of poisson test clouds reach the clustered classifier, 9.5% the repulsive one), and without
  # it they are forced into a family. With it, the repulsive branch gets a model too (matern2 | reject).
  reject:
    enabled: true
    # Reject examples, all from the bank, no stage-1 prediction involved:
    #   poisson       every poisson cloud
    #   below_cutoff  the branch's own families' clouds OUTSIDE the regime at this tau (none at tau 0)
    #   other_group   the other group's families (clustered <-> repulsive leaks, ~1-5% of a family)
    sources: [poisson, below_cutoff, other_group]
    # Every class, reject included, gets equal total weight on the training rows. (Alternative:
    # weight reject by its expected share of arrivals, ~14% under the prior.)

stage3:                         # per-family parameter regressors, on log(target) with squared error
  models: [hgb, nn, perslay_z_rips, perslay_z_alpha_diameter, perslay_z_dtm_k5, perslay_z_dtm_k10,
           perslay_z_dtm_k15, perslay_z_dtm_k20]
  # Targets are cloudforger's TARGETS: thomas kappa,mu,sigma | nested kappa,mu1,mu2,sigma1,sigma2 |
  # matern2 R,lam_p | lgcp nbar,sigma2,s.
  poisson: mle                  # anything ending at poisson gets nbar_hat = n, the exact MLE
  # Clip estimates to the training targets' range: a sampler fed an out-of-prior theta can blow up.
  clip_to_train_range: true

pipeline:
  # Stage 3's tau, for each stage-2 tau: `same` and/or 0. Without reject, filtered stage-3 regressors
  # lost to unfiltered ones because below-cutoff clouds still reached them; `0` tests that again.
  stage3_taus: [same, 0]

# Named models, usable at stages 2 and 3 (and `nn_model` below for a network stage 1).
#   hgb   gradient-boosted trees on cascade/features.py (CPU, components.sh)
#   nn    cloudforger's PHNet on its `nn:` input; the entry overrides the `nn:` defaults (GPU)
models:
  hgb: {kind: hgb}
  nn: {kind: nn, curves: "L@fixed,F@fixed,G@fixed,J@fixed"}          # the best 5-way arm
  # PersLay with the pooled vector z-scored (scripts/train.py --perslay --perslay-norm zscore), H0+H1
  perslay_z_rips: {kind: nn, filtration: rips, dims: "0,1", perslay: true, perslay_norm: zscore}
  perslay_z_alpha_diameter: {kind: nn, filtration: alpha_diameter, dims: "0,1", perslay: true, perslay_norm: zscore}
  perslay_z_dtm_k5: {kind: nn, filtration: dtm_k5, dims: "0,1", perslay: true, perslay_norm: zscore}
  perslay_z_dtm_k10: {kind: nn, filtration: dtm_k10, dims: "0,1", perslay: true, perslay_norm: zscore}
  perslay_z_dtm_k15: {kind: nn, filtration: dtm_k15, dims: "0,1", perslay: true, perslay_norm: zscore}
  perslay_z_dtm_k20: {kind: nn, filtration: dtm_k20, dims: "0,1", perslay: true, perslay_norm: zscore}

nn:                             # defaults for every `kind: nn` model -- scripts/train.py's defaults
  seed: 1
  epochs: 200
  patience: 30
  batch_size: 128
  lr: 0.001

evaluation:                     # end-to-end score: cascade/evaluate.py with cascade/scoring's scores
  clouds:                       # scoring.bank.pick: test split, replicate 0, stratified by delta-tilde
    per_bin: 15                 # per (family, bin) for structured families; x n_bins Poisson clouds
    delta_edges: [-.inf, 0.0, 1.0, 4.0, .inf]
    seed: 0
  # Named sets of pipelines, each scored on the SAME clouds (evaluate.py --set NAME, output in
  # evaluation/NAME/). Stage 1 is always the run's; stage2 is one model; stage3 is one model or a
  # mapping family -> model; crossed with taus (`all` = regime.taus) and stage3_taus (`same` = the
  # stage-2 tau, or numbers, e.g. 0).
  variants:
    hgb:                        # trees everywhere
      stage2: hgb
      stage3: hgb
      taus: all
      stage3_taus: [same]
    mixed:                      # trees to route; curves network for the clustered families' parameters,
      stage2: hgb               # PersLay-z for matern2's (rips: the only filtration done at every tau
      stage3:                   # when this was set up -- swap in a DTM one when its runs finish)
        thomas: nn
        nested: nn
        lgcp: nn
        matern2: perslay_z_rips
      taus: all
      stage3_taus: [same]
  kernel:                       # primary: local_kernel.Component, the power check's recommended setting
    R: 1.5                      # configuration radius, in mean spacings
    kind: point                 # centres at the pattern's own points
    h: 0.1
    grid: 21
    centres: 300
    pool: 1000
    sims: 16                    # simulated patterns per model
    tau_mult: "1.0"             # kernel width = 1 x the median distance between x's configurations
  dss:                          # secondary: Dawid-Sebastiani on the non-PH geometric statistics
    enabled: true
    groups: no_ph               # dss.NO_PH: no overlap with the PersLay features being scored
    sims: 150                   # mean + covariance of the statistics need O(100) patterns
  # skill = 1 - sum(regret)/sum(gain) only where the gain is resolved (> this many s.e.); per-cloud
  # d' is ~1, so read pooled cells, never single clouds.
  skill_min_z: 2
  seed: 0
