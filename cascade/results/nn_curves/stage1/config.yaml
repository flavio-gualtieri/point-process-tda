# `nn_curves`: stage 1 = the best 5-way arm, the L+F+G+J curves on the fixed grid through
# cloudforger's PHNet (scripts/train.py --curves L@fixed,F@fixed,G@fixed,J@fixed), trained on the
# three groups. Stage 1 only for now: sbatch cascade/stage1_nn.sh with CONFIG pointing here.
#
# One file = one cascade run. Every modelling choice of the pipeline is here, with the reason it
# was made and what the alternatives are, so a run is reproducible from its config alone and an
# ablation is a copy of this file with one line changed:
#
#   cp cascade/configs/default.yaml cascade/configs/<name>.yaml     # edit, set `name: <name>`
#   CONFIG=cascade/configs/<name>.yaml sbatch cascade/run.sh         # every stage, in order
#
# run.sh is just: stage1.py train -> stage2.py -> stage3.py -> pipeline.py -> evaluate.py, each
# with --config. A stage reads its upstream stages from the same run directory, so after changing
# e.g. a stage-3 choice only stage3.py onward needs re-running (under a new `name`, to keep both).
#
# Outputs land in cascade/results/<name>/, and each stage copies this file there as config.yaml,
# so a result can always be traced back to the choices that produced it.

name: nn_curves

# Class prior used EVERYWHERE (training weights, benchmark collapse, scoring).
#   balanced_groups: poisson / clustered / repulsive get 1/3 each, split evenly over the group's
#                    families (thomas, nested, lgcp get 1/9 each). Without it `clustered` would get
#                    3/5 of the prior just for having three families in the bank.
# The only option implemented. The natural alternative is a prior matched to a real application.
prior: balanced_groups

# Feature set shared by every learned stage: cascade/features.py (111 classical summary-function
# samples + log n). A stage-specific feature set (e.g. PersLay H0 for the repulsive branch) will be
# a `features:` key inside that stage; the default is to inherit this one.
features: classical

stage1:                         # poisson | clustered | repulsive
  model: nn                    # hgb (gradient-boosted trees) | logreg | nn (GPU: stage1_nn.py)
  # Out-of-fold predictions on the TRAIN split, K folds grouped by theta (both replicates of a
  # theta stay in one fold). Cascade training routes stage 2's training set with these, and they
  # must be out-of-fold: in-sample predictions are overconfident and would route almost every train
  # cloud correctly, so stage 2 would never see the misrouted clouds it meets at test time.
  crossfit_folds: 5
  nn:                           # only read when model: nn -- cloudforger's PHNet, scripts/train.py
    curves: "L@fixed,F@fixed,G@fixed,J@fixed"   # the classical arm; set -> filtration/dims/perslay unused
    filtration: dtm_k10         # ignored when curves is set; dtm_k10 PersLay H0+H1 is the best collapsed 5-way run
    dims: "0,1"
    perslay: true
    seed: 1
    epochs: 200
    patience: 30
    batch_size: 128
    lr: 0.001

stage2:                         # family within the routed group
  model: hgb
  # How a cloud is sent to a group: argmax of the stage-1 posterior. (A soft alternative, e.g.
  # "not poisson unless P(poisson) > t", is a one-line change in pipeline.route_group.)
  routing: argmax
  # cascade: train each group's classifier on the train clouds stage 1 ROUTES to that group,
  #          using the out-of-fold stage-1 predictions -- the same distribution it sees at test time.
  # oracle:  train on the clouds whose TRUE family is in the group (clean data, but then the test
  #          inputs are out of distribution). Kept as the ablation.
  # regime:  train on ALL clouds past stage 1's regime boundary, plus reject candidates weighted
  #          by how often stage 1 sends clouds like them here (see `regime:` below). More data
  #          than cascade, and needs no out-of-fold stage-1 predictions.
  training: cascade
  # Clouds routed to a group they do not belong to (mostly near-CSR poisson clouds called
  # `clustered`) get their own `reject` class; a reject at test time is treated as poisson.
  # false: drop them from training, and stage 2 is forced to pick one of the group's families.
  reject: true
  crossfit_folds: 5             # out-of-fold train predictions, used by stage 3's cascade training

stage3:                         # parameters of the routed family
  model: hgb                    # hgb | ridge; one regressor per target, fitted on log(target)
  # Targets are cloudforger's TARGETS: thomas kappa,mu,sigma | nested kappa,mu1,mu2,sigma1,sigma2 |
  # matern2 R,lam_p | lgcp nbar,sigma2,s | poisson nbar.
  # cascade: train on train clouds of the family that the pipeline routes to that family.
  # regime:  every train cloud of the family past stage 1's regime boundary (see `regime:`).
  # all:     every train cloud of the family (more data, including near-CSR ones stage 1 filters).
  # Misrouted clouds cannot be training data either way: they have no true value of this family's
  # parameters.
  training: cascade
  # Anything that ends at poisson (stage 1 says poisson, or stage 2 says reject) gets
  # nbar_hat = n, the exact MLE on the unit window. No model.
  poisson: mle
  # Clip estimates to the range of the training targets before simulating: a sampler fed an
  # out-of-prior theta can blow up (e.g. huge kappa, or an LGCP grid that does not exist).
  clip_to_train_range: true

# Only read by `training: regime` (stage2, stage3); cascade/regime.py has the details.
regime:
  # Stage 1's routing curve P(routed to group | family, coordinate) is estimated on HELD-OUT
  # stage-1 predictions: val (always available, 2000 clouds per family) | train_oof | both.
  source: val
  # The regime coordinate: one manifest column for all families, or a mapping, e.g.
  #   {default: delta_tilde_hi, matern2: delta_tilde_lo}
  coordinate: delta_tilde
  bins: 10                      # quantile bins of the coordinate per family
  # A cloud is past the boundary when clouds of its family at its coordinate reach their own group
  # with probability >= threshold. Lower = more (and noisier) training clouds downstream.
  threshold: 0.5
  # Weight of reject candidates in stage 2: routing_probability (prior x P(stage 1 sends it
  # here) -- "some" near-CSR clouds, in the proportion that really arrive) | uniform (all, full weight).
  reject_weight: routing_probability

evaluation:                     # see cascade/wasserstein.py for what each choice means
  clouds_per_family: 40         # test clouds scored, per TRUE family (rep 0 of random test thetas)
  sims: 8                       # simulated patterns per model per cloud
  ground: exact                 # exact W_p by assignment on equal-size subsamples
  p: 1                          # W_1: a metric, and less dominated by a few far points than W_2
  max_points: 400               # both patterns thinned to min(n_obs, n_sim, max_points) points
  condition_n: true             # simulated patterns conditioned on n in the bank's range [20, 2000]
  references: [oracle, csr]     # scored alongside the pipeline's fit on the same cloud
  # skill = 1 - sum(regret)/sum(gain) is reported for a cell only when its mean gain (CSR minus
  # truth) exceeds this many standard errors; near CSR the gain is Monte Carlo noise and the
  # ratio is meaningless. Lower it to see more cells, at the cost of noisy ratios.
  skill_min_z: 2
  seed: 0
