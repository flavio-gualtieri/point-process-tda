# What the paper's figures and tables are built from (paper/scripts/). Paths are relative to the repo.
# Now: the paper run as it stands. After the rerun: run: <results>/pipeline, evaluation sets named
# main / ph_ablation / ph_cell / mincontrast, power: <results>/scores/power, ablation: <results>/ablation.

run: oneshot/results/default

evaluation:                         # the run's end-to-end evaluation sets
  main: evaluation/networks         # the headline clouds (480): fusion, curves, ph, classical, best
  networks_cell: evaluation/networks_cell   # cell k >= 5 (1000), classifier fixed: which estimator
  mincontrast: evaluation/heldout_mincontrast   # the same 480 clouds: mincontrast, oracle_ph, oracle_mincontrast
  ph_ablation: evaluation/heldout_ph_ablation
  ph_cell: evaluation/heldout_ph_cell

# The headline clouds rescored with 5 simulation seeds (same fits; kernel score only; seed 0 = the
# stored scores) and the wrong-model ladder, frozen from the score check outside the repo.
repeat: results/frozen/scorecheck/repeat_seed*.csv
dose: results/frozen/scorecheck/dose_seed0.csv

power: cascade/scoring/results/power      # scripts/power.py output (T8); 5 families only, superseded by `dose`
ablation: null                            # the single-model study's run, once it exists

frozen_classifier: fusion_curves_alpha_dtm10    # F3's confusion matrix
headline_variant: fusion                  # the evaluation.main pipeline T6 reports
highlight: [fusion_curves_alpha_dtm10, nn_curves, hgb_classical_ph]   # F5: coloured; every other model muted grey

# The story (paper/scripts/summary.py): one network, and controls laid out as input x learner.
story:
  headline: fusion_curves_alpha_dtm10
  grid:                             # input -> {learner: model}
    classical + PH: {network: fusion_curves_alpha_dtm10, trees: hgb_classical_ph}
    classical: {network: nn_curves, trees: hgb_classical}
    PH: {network: perslay_dtm10, trees: hgb_ph}      # perslay_dtm10: the most accurate PH-only network
  floor: [linear_classical]
  pipelines:                        # end-to-end variant -> label; all scored on the same 480 clouds
    fusion: network, classical + PH
    ph: trees, classical + PH
    curves: network, classical
    classical: trees, classical
    mincontrast: minimum contrast
    oracle_ph: true family, trees classical + PH
  cell_pipelines:                   # networks_cell variants (classifier hgb_classical everywhere)
    fusion_estimators: network, classical + PH
    ph_estimators: trees, classical + PH
    curves_estimators: network, classical
    classical: trees, classical
