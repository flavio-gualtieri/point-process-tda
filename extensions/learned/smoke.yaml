# Smoke test of learned point-cloud summaries (extensions/learned/learned.py). Small on purpose: every
# 10th theta (10% of the bank: 59k train clouds for the classifier, 7.4k per family for estimators),
# a short schedule. Its job is to show the models train and roughly where they land against gradient
# boosting on the same rows -- not to settle the comparison (that needs thin: 1 and a longer schedule).
name: smoke

thin: 10
k: 16                         # nearest neighbours per point (graph degree and DeepSets' neighbourhood)

archs:
  deepsets: {hidden: 128}
  gnn: {hidden: 64, layers: 3}

classify: true
estimate: [thomas, nested, lgcp, matern2, ring, matern1, cell]

train:
  epochs: 40
  patience: 8
  batch_size: 64
  lr: 0.001
  workers: 8                  # DataLoader processes (k-NN graphs are built on the fly, on CPU)
  seed: 1

# Paper-run predictions scored on the same test rows (trained on all train rows: reference only).
paper_baselines:
  classify: [hgb_classical, hgb_classical_ph, nn_curves]
  estimate: [hgb_classical, hgb_classical_ph, nn_curves]
