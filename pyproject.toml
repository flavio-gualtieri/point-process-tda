[project]
name = "cloudforger"
version = "0.1.0"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "gudhi",
    "ripser",
    "pyyaml",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: exercises the full CLI pipeline end-to-end (generate/featurize/train/evaluate)"]