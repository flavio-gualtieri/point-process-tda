# configs/params/thomas.yaml
task: classify
process: thomas
methods: [raw_pc]
# --- Path templates ({method} and {process} are filled in per run) ---
dataset_path_template: data/params/{process}
output_dir_template:   results/params/{process}/{method}
# --- Hyperparameters ---
batch_size: 32
n_epochs: 500
lr: 0.001
n_points: 500
embedding_dim: 128
hidden_dims: [64, 128, 256]
seed: 0