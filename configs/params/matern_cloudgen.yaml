# configs/params/matern_cloudgen.yaml

process: matern
dimension: 2
seed: 0
format: dict
n_hint: 0

design:
  mode: grid
  reps: 8

  # train/test ~= 81 * 8 = 648 clouds
  # adversarial ~= 13 * 8 = 104 clouds
  grid:
    parent_intensity:
      kind: logspace
      low: 10.0
      high: 200.0
      num: 9
    hardcore_radius:
      kind: logspace
      low: 0.02
      high: 0.15
      num: 9

  # Used only when design.mode = random.
  random:
    n_param_vectors: 5000
    ranges:
      parent_intensity: {low: 10.0, high: 200.0, scale: log}
      hardcore_radius: {low: 0.02, high: 0.15, scale: log}

adversarial:
  enabled: true
  fraction: 0.15
  n_param_vectors: null
  seed_offset: 100000
