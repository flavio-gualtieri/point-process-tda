# configs/params/pipeline.yaml

process: "thomas"

dimensions: [2]
data_root: data/params
skip_missing: true
overwrite: true

stages:
  - compute_diagrams

splits:
  train_test:
    clouds: clouds.pkl
    diagrams: diagrams.pkl
    images: images.pkl
    betti: betti.pkl
    features: features.pkl
  adversarial:
    clouds: adversarial_clouds.pkl
    diagrams: adversarial_diagrams.pkl
    images: adversarial_images.pkl
    betti: adversarial_betti.pkl
    features: adversarial_features.pkl

formats:
  clouds: dict
  diagrams: dict
  betti: dict
  features: dict

cloud_generation:
  config_path: /Users/qp252676/Desktop/point-process-tda/configs/params/processing/thomas_cloudgen.yaml

filtration:
  type: dtm
  k: 5
  q: 2
  maxdim: 1
  thresh: null

vectorization:
  homology_dims: [0, 1]
  resolution: 128
  sigma: 0.05
  calibration_split: train_test

betti:
  homology_dims: [0, 1]
  grid_size: 512
  grid_range: [0.0, 0.25]
  drop_infinite: true
  normalize: false

pair_distance:
  n_samples: 5000
  grid_size: 64
