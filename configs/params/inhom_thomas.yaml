# configs/params/inhom_thomas.yaml

process: inhom_thomas
task: params

use_covariates: true

dims: [2]

target_label_names:
  - parent_intensity
  - cluster_scale
  - beta_0
  - beta_1
  - beta_2
  - beta_3
  - beta_4
  - beta_5

methods:
  - pi_0
  - pi_1
  - pairwise
  - betti_0
  - betti_1

log_label_names:
  - parent_intensity
  - cluster_scale

batch_size: 32
n_epochs: 500
lr: 0.001
n_points: 512
embedding_dim: 128
hidden_dims: [128, 128]
seed: 0

output_dir_template: "results/params/{dim}d/{process}/{experiment}"