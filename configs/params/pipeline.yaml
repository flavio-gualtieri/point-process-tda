# configs/params/pipeline.yaml
#
# Default run config for scripts/processing/params/pipeline.py. Pass a
# different file as the positional `config` CLI arg to run a different
# process/dimension set (e.g. a copy of this file with cloud_generation
# pointed at configs/params/matern_cloudgen.yaml). CLI flags such as
# --dimensions/--process/--stages override whatever this file sets.

# Left empty so it's auto-resolved from cloud_generation.config_path's
# 'process' field; set explicitly to skip that lookup.
process: ""

dimensions: [2]
data_root: data/params
skip_missing: true
overwrite: true

stages:
  - generate_clouds
  - compute_pairwise
  - compute_diagrams
  - vectorize_diagrams
  - compute_betti

splits:
  train_test:
    clouds: clouds.pkl
    diagrams: diagrams.pkl
    images: images.pkl
    betti: betti.pkl
    features: features.pkl
  adversarial:
    clouds: adversarial_clouds.pkl
    diagrams: adversarial_diagrams.pkl
    images: adversarial_images.pkl
    betti: adversarial_betti.pkl
    features: adversarial_features.pkl

formats:
  clouds: dict
  diagrams: dict
  betti: dict
  features: dict

cloud_generation:
  config_path: configs/params/thomas_cloudgen.yaml

filtration:
  maxdim: 1
  thresh: null

vectorization:
  homology_dims: [0, 1]
  resolution: 64
  sigma: 0.05
  calibration_split: train_test

betti:
  homology_dims: [0, 1]
  grid_size: 128
  grid_range: [0.0, 1.0]
  drop_infinite: true
  normalize: false

pair_distance:
  n_samples: 5000
  grid_size: 64
