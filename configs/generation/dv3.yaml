# DV3 generation spec -- docs/theory/generation.tex.
# Numbers only: the logic that reads them lives in src/cloudforger/generation/.
# The window is fixed at W = [0,1]^2 in code (samplers.WINDOW), not configured here.

dataset: DV3

# Master seed for every random stream in DV3 (seeding.py). Drawn once with
# secrets.randbits(128) on 2026-09-14. NEVER change it once data exist: every
# case's parameters and pattern are derived from it.
root: 70519940839025816406438102027139626253

# Expected number of points, drawn log-uniformly and identically for every family.
nbar: {low: 100, high: 800}

# Shape priors in dimensionless design coordinates (Table "The DV3 prior").
# Every coordinate is log-uniform on [low, high]; constraints reject the shape
# at the drawn nbar, never nbar itself.
families:
  poisson: {}
  thomas:
    mu: {low: 0.1, high: 30}      # mean cluster size (the amplitude)
    s:  {low: 0.1, high: 1.5}     # cluster s.d. in point spacings, s = sigma * sqrt(nbar)
    constraints:
      sigma_max: 0.1              # cluster s.d. at most a tenth of the window
      kappa_min: 5                # at least five clusters in W on average
  nested:
    mu1: {low: 1.5, high: 6}      # parents per meta-cluster
    mu2: {low: 0.03, high: 20}    # children per parent (the amplitude)
    s2:  {low: 0.05, high: 0.5}   # inner (child) scale in spacings, s2 = sigma2 * sqrt(nbar)
    rho: {low: 3, high: 12}       # scale ratio sigma1 / sigma2; >= 3 separates the two steps of K
    constraints:
      kappa_min: 15               # enough meta-clusters to identify mu1
      outer_max: 0.2              # 2 sqrt(sigma1^2 + sigma2^2): meta-clusters within a fifth of W
  matern2:
    tau: {low: 0.05, high: 0.55}  # hard-core distance in spacings, tau = R * sqrt(nbar); pi tau^2 < 1
  lgcp:
    sigma2: {low: 0.05, high: 3}  # field variance (the amplitude)
    sp:     {low: 0.5, high: 2}   # correlation length in spacings, sp = s * sqrt(nbar)
    constraints:
      s_max: 0.15                 # correlation range 3s under half the window (ergodic in W)
    grid:                         # resolution criterion (lgcp_grid.py): smallest power of two
      tol: 0.1                    #   >= M_min with sup |K_grid - K| <= tol * null s.d. of K-hat
      M_min: 256
      M_max: 4096

# CSR null tables for delta-tilde (nulls.py, WP2a): binomial patterns at each n,
# first half of the replicates -> m0, s0; held-out second half -> c95.
null_tables:
  path: null_tables.npz           # relative to this file; committed
  n_grid: [50, 60, 72, 86, 104, 124, 149, 179, 215, 258, 310, 372, 446, 536, 643, 771, 926, 1111, 1333, 1600]
  reps: 12000                     # 6000 fit + 6000 held out: s.e. of c95 <= 0.05 at every n (V9)

# Prior-drawn sets. Training carries a fixed train/val split assigned at generation.
sets:
  train: {size: 10000, n_val: 1500}
  A:     {size: 5000}

# Cases per shard (one SLURM task each).
shard_size: 500
