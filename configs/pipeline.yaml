# The pipeline: one classifier over every family, then per-family inference. Every modelling choice
# is a key here; outputs land in <results>/<name>/ (cloudforger.paths). How to run: README.md.
#
#   classify    one N-way classifier over every family. Its P(poisson | x) IS the CSR filter: a cloud
#               called poisson gets nbar_hat = n (the exact MLE) and no further model.
#   estimate    one regressor per (family, model), on log(target), trained on ALL the family's train clouds
#   compare     every classifier, every estimator and every classifier x estimator pipeline, scored on
#               the same test clouds, overall and in regime (cutoffs from a reference classifier)

name: pipeline

families: [poisson, thomas, nested, lgcp, matern2, ring, matern1, cell]

# Class weights for training and scoring: `equal` (every family the same total weight) or a mapping
# family -> weight (renormalised), e.g. to reproduce a group prior.
prior: equal

# ---------------------------------------------------------------------------------------- inputs
# Named feature tables for table learners (hgb, linear). `source` is a loader in pipeline/inputs.py;
# both are built by scripts/tables.py:
#   classical   classical/table.py: L(r)-r on the fixed axis, L,F,G,J on u = r sqrt(n), log n (111)
#   ph          vectorization/summaries.py of one filtration's diagrams (105), for every `ph` input here
inputs:
  classical: {source: classical}
  ph_alpha: {source: ph, filtration: alpha_diameter}
  ph_dtm10: {source: ph, filtration: dtm_k10}
  ph_rips: {source: ph, filtration: rips}
  ph_dtm5: {source: ph, filtration: dtm_k5}
  ph_dtm15: {source: ph, filtration: dtm_k15}
  ph_dtm20: {source: ph, filtration: dtm_k20}

# ---------------------------------------------------------------------------------------- models
# A model = a learner + its input. Any model can serve as classifier and as estimator.
#   learner: hgb | linear      table learners (CPU); `inputs` = list of names above, concatenated
#   learner: nn                cloudforger's PHNet (GPU); its input is in the entry itself
#                              (curves, and/or filtration + dims [+ perslay]); see pipeline/nn.py
# Learner options go in `params` (overriding the learner's defaults in pipeline/learners.py).
models:
  hgb_classical: {learner: hgb, inputs: [classical]}
  hgb_ph: {learner: hgb, inputs: [ph_alpha, ph_dtm10]}
  hgb_classical_ph: {learner: hgb, inputs: [classical, ph_alpha, ph_dtm10]}
  linear_classical: {learner: linear, inputs: [classical]}
  nn_curves: {learner: nn, curves: "L@fixed,F@fixed,G@fixed,J@fixed"}
  perslay_dtm10: {learner: nn, filtration: dtm_k10, dims: "0,1", perslay: true, perslay_norm: zscore}
  perslay_alpha: {learner: nn, filtration: alpha_diameter, dims: "0,1", perslay: true, perslay_norm: zscore}
  # Every filtration in one table; persistence-image CNNs; curves + PH images fused in one network.
  hgb_classical_ph6: {learner: hgb, inputs: [classical, ph_alpha, ph_dtm10, ph_rips, ph_dtm5, ph_dtm15, ph_dtm20]}
  pi_alpha: {learner: nn, filtration: alpha_diameter, dims: "0,1"}
  pi_rips: {learner: nn, filtration: rips, dims: "0,1"}
  fusion_curves_alpha: {learner: nn, curves: "L@fixed,F@fixed,G@fixed,J@fixed", filtration: alpha_diameter, dims: "0,1"}

nn:                             # defaults for every `learner: nn` model
  seed: 1
  epochs: 200
  patience: 30
  batch_size: 128
  lr: 0.001

# ------------------------------------------------------------------------------------ what to train
# Each name trains once per task (and per family for estimators); existing outputs are skipped, so
# adding a name here and resubmitting trains only what is new.
classify: [hgb_classical, hgb_ph, hgb_classical_ph, linear_classical, nn_curves, perslay_dtm10, perslay_alpha,
           hgb_classical_ph6, pi_alpha, pi_rips, fusion_curves_alpha]
estimate: [hgb_classical, hgb_ph, hgb_classical_ph, nn_curves, perslay_dtm10, perslay_alpha,
           hgb_classical_ph6, pi_alpha, pi_rips, fusion_curves_alpha]

# Out-of-fold predictions on the train split (folds grouped by theta), for classifiers whose learner
# supports cheap refits (table learners). The regime cutoffs are fitted on these when present.
crossfit_folds: 5
clip_to_train_range: true       # estimates clipped to the train targets' range (log scale)

# ---------------------------------------------------------------------------------------- regime
# "In regime" = the reference classifier detects the family (does not call it poisson) with
# probability >= tau, as a monotone function of u = log(coordinate) + a log(nbar) (pipeline/regime.py).
# The cutoff is a frozen rule on theta, so every model is scored on the SAME in-regime clouds.
regime:
  classifier: hgb_classical     # fitted on its out-of-fold train predictions, else on val
  event: detected               # detected = not called poisson | identified = called its own family
  # One coordinate per family (pipeline/regime.py COORDINATES, or any manifest column); null = no
  # monotone coordinate, the whole family counts as in regime. Cell's detection is U-shaped in k
  # (k = 2 is clumpy, large k near-lattice), so it has none.
  coordinates: {thomas: omega, nested: omega_inner, lgcp: zeta, matern2: zeta, ring: omega,
                matern1: zeta, cell: null}
  taus: [0.5, 0.9]

# ------------------------------------------------------------------------------------- compare
compare:
  baseline: hgb_classical       # paired differences are against this model
  bootstrap: 200                # resamples of test thetas, within family
  seed: 0
  # Pipelines = every classifier x every estimator assignment below. An assignment is a model name
  # (every family), `best` (per family, the estimator with the lowest val error), or a mapping
  # family -> model with an optional `name`, e.g. {name: nets, thomas: nn_curves, ...}.
  classifiers: all              # or a list of names from `classify`
  estimators: [best, hgb_classical]
  poisson_threshold: null       # null = argmax; t = call poisson whenever P(poisson | x) >= t

# ------------------------------------------------------------------------------------ evaluation
# End-to-end kernel / Dawid-Sebastiani score of whole pipelines (scripts/endtoend.py --set NAME ->
# evaluation/NAME/): fit on replicate 0 of a test theta, score against the independent replicate 1.
evaluation:
  clouds:
    # Test clouds, stratified WITHOUT delta-tilde: by the regime (P(detected | u) from the frozen
    # cutoffs: below 0.5, 0.5-0.9, above 0.9) for families with a coordinate, by k for cell, and
    # per_bin x 3 poisson clouds as the noise floor.
    per_bin: 20
    cell_k_edges: [2, 3, 5, 31]
    seed: 0
  kernel: {R: 1.5, kind: point, h: 0.1, grid: 21, centres: 300, pool: 1000, sims: 16, tau_mult: "1.0"}
  dss: {enabled: true, groups: no_ph, sims: 150}
  skill_min_z: 2
  seed: 0
  # Named sets: each = pipelines (a classifier + an estimator assignment, as compare.estimators) and
  # optional overrides of the `clouds` keys above; everything else is shared.
  sets:
    # The headline: the best pipeline against the classical-features one.
    main:
      pipelines:
        best: {classifier: hgb_classical_ph, estimators: best}
        classical: {classifier: hgb_classical, estimators: hgb_classical}
    # Does PH change the realizations? Same learner everywhere, with and without the PH columns, and
    # the classifier held fixed in `ph_estimators` to separate routing from parameters. Clouds only
    # where the score has power (the 480-cloud run resolved gain only above 0.9 and in cell), sized
    # from its per-cloud noise: ~1100 clouds to see the `best` - `classical` difference at 2 s.e.
    ph_ablation:
      pipelines:
        classical: {classifier: hgb_classical, estimators: hgb_classical}
        ph: {classifier: hgb_classical_ph, estimators: hgb_classical_ph}
        ph_estimators: {classifier: hgb_classical, estimators: hgb_classical_ph}
      clouds: {per_bin: 120, strata: [above 0.9, k 2-2, k 3-4, k 5-30], poisson: 0, seed: 1}
    # ph_ablation's one suggestive cell: cell k >= 5. Only that stratum resolves gain; ~1000 clouds for
    # the difference at 2 s.e. Fresh seed.
    ph_cell:
      pipelines:
        classical: {classifier: hgb_classical, estimators: hgb_classical}
        ph: {classifier: hgb_classical_ph, estimators: hgb_classical_ph}
        ph_estimators: {classifier: hgb_classical, estimators: hgb_classical_ph}
      clouds: {per_bin: 1000, strata: [k 5-30], poisson: 0, seed: 2}
    # The classical baseline end to end, on the headline evaluation's clouds. `oracle` routes every
    # cloud to its true family, so oracle_* compare the parameter estimates alone.
    mincontrast:
      pipelines:
        classical: {classifier: hgb_classical, estimators: hgb_classical}
        ph: {classifier: hgb_classical_ph, estimators: hgb_classical_ph}
        mincontrast: {classifier: mincontrast, estimators: mincontrast}
        oracle_ph: {classifier: oracle, estimators: hgb_classical_ph}
        oracle_mincontrast: {classifier: oracle, estimators: mincontrast}

# ----------------------------------------------------------------------------------- mincontrast
# Classical baseline (scripts/mincontrast.py): minimum contrast on Ripley's K against each family's
# closed-form K, and a selection by penalised contrast. Writes the units classify/mincontrast,
# classify/oracle and estimate/<f>/mincontrast. Knobs are tuned on val, as the learned models' early
# stopping and `best` are; the textbook `default` is reported beside the tuned one.
mincontrast:
  c: [0.25, 0.5]                  # contrast exponent (Diggle 1983: 1/4 for clustering, 1/2 for regularity)
  r_max: [0.0625, 0.125, 0.25]    # upper radius; 0.25 = a quarter of the side, spatstat's default
  lambdas: [0, 0.003, 0.01, 0.016, 0.03, 0.1, 0.3, 1, 3]   # selection penalty per free parameter, on log D
  default: {c: 0.25, r_max: 0.25, lambda: 0.016}           # lambda 0.016 = AIC's 2p over 128 radii
  radii_step: 4                   # every 4th radius of the 512-point K grid (128 radii at r_max 0.25)
  init: 64                        # train-prior draws the contrast is evaluated at ...
  starts: 2                       # ... the best of which start bounded Nelder-Mead
  chunks: 16                      # fit array = 6 models x chunks
  seed: 0
