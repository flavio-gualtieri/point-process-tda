# python scripts/train.py configs/runs/dv3/thomas/mincontrast_g.yaml --seed 9371
#
# DV3 -- thomas: classical minimum contrast on g (mincontrast_g).
# Trains on data/dv3/train/<group>/ with the generation-time train/val split
# and writes predictions_<set>.npz for every set in data.eval_sets; compare
# across regimes with scripts/evaluate_regimes.py (see configs/runs/dv3/README.md).
#
# Fits every pattern of A, B and C (deterministic: one rng stream per
# case_id; fits cached under results/dv3_<fam>/raw/<method>/_fits/ and reused
# by every seed). Loss is standardized with the SAME train-split statistics the
# trained methods use. jobs = worker processes for the fits.
process:
  name: dv3_thomas

data:
  source: dv3
  group: thomas
  eval_sets: [A, B, C]

method:
  name: mincontrast_g
  params:
    n_starts: 10
    c: 0.25                  # validated for aggregated patterns; the g modules' own default is 1.0
    jobs: 16

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [kappa, mu, sigma]
