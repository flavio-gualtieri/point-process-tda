# python scripts/train.py configs/runs/dv3/thomas/vihrs.yaml --seed 9371
#
# DV3 -- thomas: vihrs (Vihrs 2022) -- 1-D CNN on L(r)-r + n(x), best-val checkpoint.
# Trains on data/dv3/train/<group>/ with the generation-time train/val split
# and writes predictions_<set>.npz for every set in data.eval_sets; compare
# across regimes with scripts/evaluate_regimes.py (see configs/runs/dv3/README.md).
#
# Results: results/dv3_<fam>/raw/vihrs_checkpointed/. Also builds the L cache the
# fusion configs read.
process:
  name: dv3_thomas

data:
  source: dv3
  group: thomas
  eval_sets: [A, B, C]

method:
  name: vihrs
  params:
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    checkpoint_best: true
    early_stopping_patience: 30

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [kappa, mu, sigma]
log_label_names: [kappa, mu, sigma]
