# python scripts/train.py configs/runs/dv3/lgcp/summstats_lfgj.yaml --seed 9371
#
# DV3 -- lgcp: the classical summary-function union -- vihrs CNN on L, F, G, J + n(x).
# Trains on data/dv3/train/<group>/ with the generation-time train/val split
# and writes predictions_<set>.npz for every set in data.eval_sets; compare
# across regimes with scripts/evaluate_regimes.py (see configs/runs/dv3/README.md).
#
# Same network and budget as vihrs.yaml; only the input channels differ.
# fg_r_max: 0.25 is the shared-grid (untuned) arm; add
#   --set method.params.fg_r_max=0.08 --set method.params.results_subdir=vihrs_lfgj_r080
# for the short-grid arm and report whichever wins on VALIDATION loss.
process:
  name: dv3_lgcp

data:
  source: dv3
  group: lgcp
  eval_sets: [A, B, C]

method:
  name: vihrs
  params:
    summary_channels: [L, F, G, J]
    fg_r_max: 0.25
    results_subdir: vihrs_lfgj
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    checkpoint_best: true
    early_stopping_patience: 30

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [nbar, sigma2, s_abs]
log_label_names: [nbar, sigma2, s_abs]
