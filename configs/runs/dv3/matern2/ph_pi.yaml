# python scripts/train.py configs/runs/dv3/matern2/ph_pi.yaml --seed 9371
#
# DV3 -- matern2: parameter estimation: ONE persistence image cell of the experiment matrix --
# ParamNet CNN on one calibrated persistence image (pi_multik, one k), a single filtration and a single homology dimension, + n(x).
#
# Template: DTM k=5, H0 as written. slurm/dv3_ph_train.sh runs every cell by
# overriding the filtration (DTM_K) and the dimension (method.params.homology_dims=[1] + results_subdir),
# so results land in results/dv3_matern2/dtm_k<K>/<subdir>/ -- one directory per
# (k, dim), never the shared pi_multik/ dir the fused configs use.
# Trains on data/dv3/train/matern2/ (train/val split fixed at generation) and
# writes predictions_<set>.npz for A, B, C; regime tables via scripts/evaluate_regimes.py.

process:
  name: dv3_matern2

data:
  source: dv3
  group: matern2
  eval_sets: [A, B, C]

filtration:
  - {name: dtm, params: {k: 5, q: 2.0, maxdim: 1}}

method:
  name: pi_multik
  params:
    homology_dims: [0]
    results_subdir: pi_multik_h0
    include_entropy: false
    resolution: 64
    sigma_pixels: 0.5
    pd_calibration_coverage: 0.95
    embedding_dim: 64
    conv_channels: [32, 64, 128]
    dropout: 0.2
    pool_type: avg
    head_hidden_dims: [64, 32]
    head_dropout: 0.1
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 50

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [lam_p, R]
log_label_names: [lam_p, R]
