# python scripts/train.py configs/runs/dv3/nested/ph_betti.yaml --seed 9371
#
# DV3 -- nested: parameter estimation: ONE Betti curve cell of the experiment matrix --
# 1-D CNN on one calibrated Betti curve beta_d(t) (betti_cnn), a single filtration and a single homology dimension, + n(x).
#
# Template: DTM k=5, H0 as written. slurm/dv3_ph_train.sh runs every cell by
# overriding the filtration (DTM_K) and the dimension (method.params.hom_dim),
# so results land in results/dv3_nested/dtm_k<K>/<subdir>/ -- one directory per
# (k, dim), never the shared pi_multik/ dir the fused configs use.
# Trains on data/dv3/train/nested/ (train/val split fixed at generation) and
# writes predictions_<set>.npz for A, B, C; regime tables via scripts/evaluate_regimes.py.

process:
  name: dv3_nested

data:
  source: dv3
  group: nested
  eval_sets: [A, B, C]

filtration:
  - {name: dtm, params: {k: 5, q: 2.0, maxdim: 1}}

method:
  name: betti_cnn
  params:
    hom_dim: 0                        # results subdir betti_cnn_<hom_dim>
    include_entropy: false
    grid_size: 128
    pd_calibration_coverage: 0.95
    embedding_dim: 64
    dropout: 0.3
    head_hidden_dims: [64, 32]
    head_dropout: 0.1
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 50

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [kappa, mu1, mu2, sigma1, sigma]
log_label_names: [kappa, mu1, mu2, sigma1, sigma]
