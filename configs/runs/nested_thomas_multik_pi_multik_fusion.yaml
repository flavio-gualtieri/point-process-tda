# Nested Thomas process -> DTM at k=5,10,15 (density-scale sweep) -> stacked
# multi-k persistence images fused with vihrs's L(r)-r branch. Matches the
# design already present under data/nested_thomas/ (v2, generated via
# scripts/generate_nested_thomas_v2.py -- see docs/nested_thomas_v2_data_report.md
# for why these ranges and the 7000/1000 train/frozen-test split). Note this
# spec is documentation only: the actual data/nested_thomas/ files were built
# by that dedicated script (not `scripts/generate.py` on this YAML), because
# it also hard-enforces a 75-point-per-cloud floor via seed resampling, which
# the generic random-design path below has no equivalent for.

process:
  name: nested_thomas
  seed: 0
  design:
    mode: random
    reps: 4
    random:
      n_param_vectors: 2000
      ranges:
        meta_parent_intensity: {low: 8.0,   high: 13.0,  scale: log}
        meta_offspring:        {low: 2.5,   high: 4.0,   scale: log}
        meta_cluster_scale:    {low: 0.05,  high: 0.15,  scale: log}
        mean_offspring:        {low: 7.0,   high: 12.0,  scale: log}
        cluster_scale:         {low: 0.003, high: 0.008, scale: log}
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

filtration:
  - {name: dtm, params: {k: 5,  q: 2.0, maxdim: 1}}
  - {name: dtm, params: {k: 10, q: 2.0, maxdim: 1}}
  - {name: dtm, params: {k: 15, q: 2.0, maxdim: 1}}

features:
  - name: persistence_image
    params: {resolution: 64, sigma_frac: 0.1, sigma_stat: "median", homology_dims: [0, 1]}

method:
  name: pi_multik
  params:
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    embedding_dim: 64
    # k_values is auto-derived from the filtration list above; override here
    # to fuse only a subset, e.g. k_values: [5, 15]

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [meta_parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
log_label_names: [meta_parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
use_adversarial: true

# Try it:
#   python scripts/generate_nested_thomas_v2.py   # (re)builds data/nested_thomas/ with the 75-pt floor; NOT scripts/generate.py --force, which would drop the floor enforcement
#   python scripts/featurize.py configs/runs/nested_thomas_multik_pi_multik_fusion.yaml
#   python scripts/train.py configs/runs/nested_thomas_multik_pi_multik_fusion.yaml --seed 9371
#   python scripts/evaluate.py configs/runs/nested_thomas_multik_pi_multik_fusion.yaml \
#       --methods pi_multik pi_multik_fusion vihrs vihrs_checkpointed betti_cnn_01
#
# The plain multi-k persistence-image model (no vihrs fusion) is the same
# data, different method:
#   method: {name: pi_multik, params: {batch_size: 32, n_epochs: 500, lr: 0.001, embedding_dim: 64}}
