# Nested Thomas -> DTM (k=5,10,15) persistence images -> pi_multik regression.
# Data built separately via scripts/generate_nested_thomas_v2.py.

process:
  name: nested_thomas
  seed: 0
  design:
    mode: random
    reps: 4  # replicate draws per sampled param vector
    random:
      n_param_vectors: 2000
      ranges:
        meta_parent_intensity: {low: 8.0,   high: 13.0,  scale: log}
        meta_offspring:        {low: 2.5,   high: 4.0,   scale: log}
        meta_cluster_scale:    {low: 0.05,  high: 0.15,  scale: log}
        mean_offspring:        {low: 7.0,   high: 12.0,  scale: log}
        cluster_scale:         {low: 0.003, high: 0.008, scale: log}
  adversarial:
    enabled: true
    fraction: 0.125       # share of clouds held out as the adversarial (OOD) split
    seed_offset: 100000   # keeps adversarial cloud seeds disjoint from train/test

filtration:
  - {name: dtm, params: {k: 5,  q: 2.0, maxdim: 1}}   # k = neighbors for the DTM density estimate
  - {name: dtm, params: {k: 10, q: 2.0, maxdim: 1}}
  - {name: dtm, params: {k: 15, q: 2.0, maxdim: 1}}

features:
  - name: persistence_image
    params: {resolution: 64, sigma_frac: 0.1, sigma_stat: "median", homology_dims: [0, 1]}
    # sigma_frac: Gaussian kernel width, as a fraction of sigma_stat's per-diagram persistence spread

method:
  name: pi_multik
  params:
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    embedding_dim: 64
    early_stopping_patience: 30  # stop after this many epochs with no val_loss improvement
    # k_values auto-derived from the filtration list above; override to fuse a subset, e.g. k_values: [5, 15]

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]  # targets to regress
log_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]     # subset of targets to log-transform before z-scoring
use_adversarial: true

# method.name above (pi_multik) is the flat-concat-across-k baseline.
# pi_multik_scaleconv is a registered sibling method -- same data/config,
# fuses the per-k embeddings with a Conv1d block over the ordered k axis
# instead. Run it on this same YAML via an override, no new config needed:
#   python scripts/train.py configs/runs/nested_thomas_pi_multik.yaml \
#       --seed 9371 --set method.name=pi_multik_scaleconv
# Results land in results/nested_thomas/dtm_k5-dtm_k10-dtm_k15/pi_multik_scaleconv/,
# never touching the pi_multik/ baseline.
