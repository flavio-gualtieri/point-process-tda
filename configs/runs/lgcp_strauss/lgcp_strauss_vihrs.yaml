# LGCP-Strauss process (Vihrs et al. 2022; Vihrs 2022 Sec. 3.3): small-scale
# Strauss inhibition (gamma, radius) modulated by a log-Gaussian random field
# exp(mu + Y(u)) with Y of variance sigma2 and correlation length s. Labels
# (mu, sigma2, s, gamma, radius). Doubly intractable -> birth-death
# Metropolis-Hastings with an exp(mu + Y(u)) activity.
#
# Cloud count = 8000 (7000 train_test + 1000 adversarial), matching
# nested_thomas (also 5 params) rather than Vihrs' 45k -- the degradation
# table wants a constant training budget. CAVEAT: this is the hardest process
# (doubly intractable, 5 params) and Vihrs' Fig. 17 shows his MSE still
# falling at 40k. Run an MSE-vs-n_param_vectors check before trusting any
# "topology loses here" result; bump to ~15-20k if it hasn't plateaued.
#
# Ranges follow Vihrs -- mu in (4.5,6), sigma2 in (0,4), s in (0.001,0.1),
# gamma in (0,1), R in (0,0.05) -- with s floored at 0.02, the interaction
# limits trimmed, and a mild E[N] <= exp(7) cap (see lgcp_vihrs.yaml).

process:
  name: lgcp_strauss
  seed: 0
  design:
    mode: random
    reps: 1
    random:
      n_param_vectors: 8000
      ranges:
        mu:     {low: 4.5,   high: 6.0,  scale: linear}
        sigma2: {low: 0.05,  high: 4.0,  scale: linear}
        s:      {low: 0.02,  high: 0.10, scale: log}
        gamma:  {low: 0.05,  high: 0.95, scale: linear}
        radius: {low: 0.005, high: 0.05, scale: linear}
      constraints:
        - "mu + 0.5 * sigma2 <= 7.0"
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

method:
  name: vihrs
  params:
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    checkpoint_best: true
    early_stopping_patience: 30

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [mu, sigma2, s, gamma, radius]
log_label_names: [s]
use_adversarial: true
