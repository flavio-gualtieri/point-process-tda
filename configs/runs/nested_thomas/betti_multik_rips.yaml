# python scripts/train.py configs/runs/nested_thomas/betti_multik_rips.yaml
#
# Single-scale reference point: same process/design/method as
# configs/runs/nested_thomas/betti_multik.yaml (shared-weight encoder +
# flat concat -- the defaults, no encoder_mode/fusion_mode/fusion_pool
# overrides needed), but with filtration: trimmed to rips alone instead of
# the DTM k=5,10,15 fusion -- k_values auto-derives to a single entry from
# this one-entry filtration list (rips has no "k" param, so that entry is
# just None; harmless, it's only ever used as a dict key -- see
# betti_multik.py's build_betti_tensor). Sibling of betti_multik_k5.yaml/
# betti_multik_k10.yaml/betti_multik_k15.yaml, and the betti_multik
# counterpart of betti_cnn_rips_h0.yaml/betti_cnn_rips_h1.yaml -- but
# unlike those two (one model per homology dim), homology_dims: [0, 1]
# below stacks H0 and H1 as two channels into ONE model, the same way
# pi_multik stacks persistence-image channels (see betti_multik.py's module
# docstring for the exact channel order). Unlike pi_multik, rips works
# fine here -- Betti curves have no birth axis to be degenerate (see
# pi_multik_rips.yaml's header for the contrast). Results land under
# results/nested_thomas/rips/betti_multik/ (separate from
# betti_cnn_rips_{h0,h1}'s own
# results/nested_thomas/rips/betti_cnn_{0,1}/, no run-tag needed).

process:
  name: nested_thomas
  seed: 0
  design:
    mode: random
    reps: 1
    random:
      n_param_vectors: 8000
      ranges:
        K:   {low: 15.0,  high: 120.0, scale: log}
        mu1: {low: 1.5,   high: 7.0,   scale: log}
        EN:  {low: 150.0, high: 800.0, scale: log}
        c1:  {low: 0.10,  high: 0.90,  scale: log}
        c2:  {low: 0.03,  high: 0.35,  scale: log}
      derived:
        meta_parent_intensity: "K"
        meta_offspring:        "mu1"
        mean_offspring:        "EN / (K * mu1)"
        meta_cluster_scale:    "c1 / (2 * sqrt(K))"
        cluster_scale:         "c2 / (2 * sqrt(K * mu1))"
      constraints:
        - "mean_offspring >= 2.5"
        - "meta_cluster_scale / cluster_scale >= 3"
        - "meta_cluster_scale / cluster_scale <= 12"
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

filtration:
  - {name: rips, params: {maxdim: 1}}

# Deliberately empty -- see betti_multik.yaml's header.
features: []

method:
  name: betti_multik
  params:
    homology_dims: [0, 1]
    # include_euler: false -- H0+H1 stacked, no derived chi = beta_0 -
    # beta_1 channel (see nested_thomas/betti_multik.yaml's header for the
    # same choice on the multi-scale sibling).
    include_euler: false
    include_entropy: false
    grid_size: 128
    pd_calibration_coverage: 0.95

    embedding_dim: 64
    dropout: 0.2

    head_hidden_dims: [64, 32]
    head_dropout: 0.1

    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 50

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
use_adversarial: true
