# python scripts/train.py configs/runs/nested_thomas/nested_thomas_pi_multik_towers.yaml --seed 9371

process:
  name: nested_thomas
  seed: 0
  design:
    mode: random
    reps: 4
    random:
      n_param_vectors: 2000
      ranges:
        meta_parent_intensity: {low: 8.0,   high: 13.0,  scale: log}
        meta_offspring:        {low: 2.5,   high: 4.0,   scale: log}
        meta_cluster_scale:    {low: 0.05,  high: 0.15,  scale: log}
        mean_offspring:        {low: 7.0,   high: 12.0,  scale: log}
        cluster_scale:         {low: 0.003, high: 0.008, scale: log}
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

filtration: []

features:
  - name: persistence_image
    params:
      resolution: 64
      sigma_frac: 0.1
      sigma_stat: median
      homology_dims: [0, 1]

method:
  name: pi_multik_towers
  params:
  # ============================== channels =================================
    m_values: [0.01, 0.04, 0.10, 0.20, 0.45]
    homology_dims: [0, 1]
    include_entropy: false

    # ============================ normalization ============================
    #   - each (m, homology_dim) persistence-image channel: independent
    #     zscore, fit on this seed's TRAIN split only (raw PI pixels are
    #     Gaussian-kernel sums with wildly different magnitude across scales).
    #   - the extra side-vector (log N, and entropy columns if enabled
    #     above): log-zscore for log N, plain zscore for entropy, both fit
    #     on TRAIN only.
    #   - targets: log-zscore, fit on TRAIN only; log_label_names below picks
    #     which target columns get the log leg of that transform.
    # All norms fit on train are reused frozen for val/test/adversarial.

    # ========================= per-k encoder (shared) ========================
    embedding_dim: 64
    conv_channels: [32, 64, 128]
    dropout: 0.2

    # ============================ scale fusion ============================
    # Conv1d block over the ordered m axis (ScaleConvFusion) -- fuses the
    # per-scale embeddings with k-adjacency instead of an order-blind concat.
    # LayerNorm (over channels, per scale-position) is baked into the block,
    # not a toggle here -- BatchNorm1d pools stats across the batch AND the
    # m axis jointly, which is unstable once m spans a wide fine-to-coarse
    # range (see scaleconv_pi.py's docstring).
    scale_fusion_hidden: 128       # Conv1d hidden width
    scale_fusion_out_dim: 128      # pooled fusion output width, feeds the head alongside n_extra
    scale_fusion_kernel_size: 3    # Conv1d kernel size along the m axis (odd -> same-padding)

    # ========================== regression head ============================
    head_hidden_dims: [64, 32]
    head_dropout: 0.1

    # ============================ optimization =============================
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 30
    fusion_dropout: 0.2
    scale_fusion_dropout: 0.1

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
use_adversarial: true
