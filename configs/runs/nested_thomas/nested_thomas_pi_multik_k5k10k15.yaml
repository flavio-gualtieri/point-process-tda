# python scripts/train.py configs/runs/nested_thomas/nested_thomas_pi_multik_k5k10k15.yaml --seed 9371
#
# Same design as nested_thomas_pi_multik.yaml (mass-fraction m_values
# channels) but with rips + DTM k=5,10,15 channels instead -- for the
# pool_type (max/avg) x optimizer (Adam/AdamW, toggled in
# PIMultiKExperiment.run(), not here) assessment. k_values below are
# auto-derived from the filtration list (no method.params.m_values set),
# matching the multi-k convention.
#
# process.design kept in sync with nested_thomas_pi_multik.yaml's K/mu1/EN/
# c1/c2 reparametrization (was the old flat meta_parent_intensity/etc.
# ranges) -- descriptive only, since data/nested_thomas/clouds.pkl already
# exists and both scripts/featurize.py and slurm/featurize_diagrams_slurm.py
# key data/nested_thomas/ off process.name alone, not this design block.

process:
  name: nested_thomas
  seed: 0
  design:
    mode: random
    reps: 1
    random:
      n_param_vectors: 8000
      ranges:
        K:   {low: 15.0,  high: 120.0, scale: log}
        mu1: {low: 1.5,   high: 7.0,   scale: log}
        EN:  {low: 150.0, high: 800.0, scale: log}
        c1:  {low: 0.10,  high: 0.90,  scale: log}
        c2:  {low: 0.03,  high: 0.35,  scale: log}
      derived:
        meta_parent_intensity: "K"
        meta_offspring:        "mu1"
        mean_offspring:        "EN / (K * mu1)"
        meta_cluster_scale:    "c1 / (2 * sqrt(K))"
        cluster_scale:         "c2 / (2 * sqrt(K * mu1))"
      constraints:
        - "mean_offspring >= 2.5"
        - "meta_cluster_scale / cluster_scale >= 3"
        - "meta_cluster_scale / cluster_scale <= 12"
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

filtration:
  # rips deliberately excluded: its H0 birth axis is degenerate (every Rips
  # H0 feature is born at filtration value 0), which build_calibrated_imager
  # rejects outright ("H0 birth axis is degenerate; use a 1-D vectorizer") --
  # confirmed by running featurize.py against this file with rips included.
  # pi_multik's channel format is uniformly 2D persistence images, so rips
  # isn't usable here regardless; matches the k5/k10/k15-only name/request.
  - {name: dtm,  params: {k: 5,  q: 2.0, maxdim: 1}}
  - {name: dtm,  params: {k: 10, q: 2.0, maxdim: 1}}
  - {name: dtm,  params: {k: 15, q: 2.0, maxdim: 1}}

features:
  - name: persistence_image
    params:
      resolution: 64
      sigma_pixels: 0.75
      homology_dims: [0, 1]
      pd_calibration_coverage: 0.95

method:
  name: pi_multik
  params:
    homology_dims: [0, 1]
    include_entropy: false

    embedding_dim: 64
    conv_channels: [32, 64, 128]
    dropout: 0.2
    pool_type: avg

    head_hidden_dims: [64, 32]
    head_dropout: 0.1

    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 50

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
use_adversarial: true
