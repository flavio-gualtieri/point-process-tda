# python scripts/train.py configs/runs/nested_thomas/nested_thomas_pi_multik.yaml --seed 9371

process:
  name: nested_thomas
  seed: 0
  design:
    mode: random
    reps: 1                          # was 4
    random:
      n_param_vectors: 8000          # was 2000
      ranges:
        K:   {low: 15.0,  high: 120.0, scale: log}
        mu1: {low: 1.5,   high: 7.0,   scale: log}
        EN:  {low: 150.0, high: 800.0, scale: log}
        c1:  {low: 0.10,  high: 0.90,  scale: log}
        c2:  {low: 0.03,  high: 0.35,  scale: log}
      derived:
        meta_parent_intensity: "K"
        meta_offspring:        "mu1"
        mean_offspring:        "EN / (K * mu1)"
        meta_cluster_scale:    "c1 / (2 * sqrt(K))"
        cluster_scale:         "c2 / (2 * sqrt(K * mu1))"
      constraints:
        - "mean_offspring >= 2.5"
        - "meta_cluster_scale / cluster_scale >= 3"
        - "meta_cluster_scale / cluster_scale <= 12"
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

filtration: []

features:
  - name: persistence_image
    params:
      resolution: 64
      sigma_pixels: 2.0
      homology_dims: [0, 1]
      pd_calibration_coverage: 0.99

method:
  name: pi_multik
  params:
  # ============================== channels =================================
    m_values: [0.01, 0.04, 0.10, 0.20, 0.45]
    homology_dims: [0, 1]
    include_entropy: false

    # ============================ normalization ============================
    #   - each (m, homology_dim) persistence-image channel: independent
    #     zscore, fit on this seed's TRAIN split only (raw PI pixels are
    #     Gaussian-kernel sums with wildly different magnitude across scales).
    #   - the extra side-vector (log N, and entropy columns if enabled
    #     above): log-zscore for log N, plain zscore for entropy, both fit
    #     on TRAIN only.
    #   - targets: log-zscore, fit on TRAIN only; log_label_names below picks
    #     which target columns get the log leg of that transform.
    # All norms fit on train are reused frozen for val/test/adversarial.

    # ========================= per-k encoder (shared) ========================
    embedding_dim: 64
    conv_channels: [32, 64, 128]
    dropout: 0.2
    pool_type: avg

    # ========================== regression head ============================
    head_hidden_dims: [64, 32]
    head_dropout: 0.1

    # ============================ optimization =============================
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 50

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
use_adversarial: true
