# RUN: python scripts/train.py configs/runs/nested_thomas/betti_multik.yaml
#
# Betti-curve/Euler-characteristic sibling of
# configs/runs/nested_thomas/pi_multik.yaml -- identical process/design/
# filtration/seeds/split, so the two are directly comparable (see
# experiments/pi_multik/betti_multik.py's module docstring).

process:
  name: nested_thomas
  seed: 0
  design:
    mode: random
    reps: 1
    random:
      n_param_vectors: 8000
      ranges:
        K:   {low: 15.0,  high: 120.0, scale: log}
        mu1: {low: 1.5,   high: 7.0,   scale: log}
        EN:  {low: 150.0, high: 800.0, scale: log}
        c1:  {low: 0.10,  high: 0.90,  scale: log}
        c2:  {low: 0.03,  high: 0.35,  scale: log}
      derived:
        meta_parent_intensity: "K"
        meta_offspring:        "mu1"
        mean_offspring:        "EN / (K * mu1)"
        meta_cluster_scale:    "c1 / (2 * sqrt(K))"
        cluster_scale:         "c2 / (2 * sqrt(K * mu1))"
      constraints:
        - "mean_offspring >= 2.5"
        - "meta_cluster_scale / cluster_scale >= 3"
        - "meta_cluster_scale / cluster_scale <= 12"
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

filtration:
  - {name: dtm,  params: {k: 5,  q: 2.0, maxdim: 1}}
  - {name: dtm,  params: {k: 10, q: 2.0, maxdim: 1}}
  - {name: dtm,  params: {k: 15, q: 2.0, maxdim: 1}}

# Deliberately empty: betti_multik computes Betti/Euler curves on the fly
# from diagrams.pkl, calibrated fresh per seed on that seed's train rows
# only -- see betti_multik.py's module docstring. No precomputed features
# file (unlike pi_multik.yaml's persistence_image entry above it).
features: []

method:
  name: betti_multik
  params:
    homology_dims: [0, 1]
    # include_euler: false -- drops the derived chi(t) = beta_0(t) -
    # beta_1(t) channel, leaving just the two beta_d(t) curves stacked
    # (the direct pi_multik-style comparison, one channel per homology
    # dim, no derived combination). Replaces the earlier include_euler:
    # true (implicit default) results, which were deleted from
    # results/nested_thomas/dtm_k5+10+15/betti_multik/ and pruned from
    # results/experiments.jsonl -- this run occupies the same results
    # path, not a new one.
    include_euler: false
    include_entropy: false
    grid_size: 128
    pd_calibration_coverage: 0.95

    embedding_dim: 64
    dropout: 0.2

    head_hidden_dims: [64, 32]
    head_dropout: 0.1

    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 50

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
use_adversarial: true
