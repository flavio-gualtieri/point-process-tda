# python scripts/train.py configs/runs/nested_thomas/betti_cnn_k10_h0.yaml
#
# dtm k=10 filtration, H0 -> one Betti curve, sampled
# evenly at grid_size points -> Conv1d-then-pool -> feature vector -> shared
# head (experiments/betti_cnn.py). Sibling of the other betti_cnn_*_h{0,1}
# configs in this directory -- same process/design/training hyperparameters
# throughout, only filtration: and method.params.hom_dim vary, so the whole
# set is a controlled filtration x homology-dim sweep.
#
# process.design is descriptive only (data/nested_thomas/clouds.pkl already
# exists from this process's own earlier generate.py run -- this file just
# drives filtration:/scripts/featurize.py against those same clouds).

process:
  name: nested_thomas
  seed: 0
  design:
    mode: random
    reps: 1
    random:
      n_param_vectors: 8000
      ranges:
        K:   {low: 15.0,  high: 120.0, scale: log}
        mu1: {low: 1.5,   high: 7.0,   scale: log}
        EN:  {low: 150.0, high: 800.0, scale: log}
        c1:  {low: 0.10,  high: 0.90,  scale: log}
        c2:  {low: 0.03,  high: 0.35,  scale: log}
      derived:
        meta_parent_intensity: "K"
        meta_offspring:        "mu1"
        mean_offspring:        "EN / (K * mu1)"
        meta_cluster_scale:    "c1 / (2 * sqrt(K))"
        cluster_scale:         "c2 / (2 * sqrt(K * mu1))"
      constraints:
        - "mean_offspring >= 2.5"
        - "meta_cluster_scale / cluster_scale >= 3"
        - "meta_cluster_scale / cluster_scale <= 12"
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

filtration:
  - {name: dtm,  params: {k: 10, q: 2.0, maxdim: 1}}

# Deliberately empty: betti_cnn computes its Betti curve on the fly from
# diagrams.pkl (always written by scripts/featurize.py regardless of this
# list), calibrated fresh per seed on that seed's train rows only -- see
# betti_cnn.py's module docstring. No precomputed features file.
features: []

method:
  name: betti_cnn
  params:
    hom_dim: 0
    include_entropy: false
    grid_size: 128
    pd_calibration_coverage: 0.95

    embedding_dim: 64
    dropout: 0.3

    head_hidden_dims: [64, 32]
    head_dropout: 0.1

    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 50

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
use_adversarial: true
