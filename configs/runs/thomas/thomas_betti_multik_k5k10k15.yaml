# python scripts/train.py configs/runs/thomas/thomas_betti_multik_k5k10k15.yaml --seed 9371
#
# Betti-curve/Euler-characteristic sibling of
# configs/runs/thomas/thomas_pi_multik_k5k10k15.yaml -- identical process/
# design/filtration/seeds/split, so the two are directly comparable (see
# experiments/pi_multik/betti_multik.py's module docstring). k_values below
# are auto-derived from the filtration list (no method.params.k_values
# set), matching the multi-k convention.
#
# process.design is descriptive only (data/thomas/clouds.pkl already exists
# from thomas_pi_multik.yaml's own generate.py run -- this file's job is
# just to drive filtration:/scripts/featurize.py against those same
# clouds).

process:
  name: thomas
  seed: 0
  design:
    mode: random
    reps: 1
    random:
      n_param_vectors: 8000
      ranges:
        K:  {low: 15.0,  high: 120.0, scale: log}
        EN: {low: 150.0, high: 800.0, scale: log}
        c:  {low: 0.10,  high: 0.90,  scale: log}
      derived:
        parent_intensity: "K"
        mean_offspring:   "EN / K"
        cluster_scale:    "c / (2 * sqrt(K))"
        c1:               "2 * cluster_scale * sqrt(parent_intensity)"
      constraints:
        - "mean_offspring >= 2.5"
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

filtration:
  # rips deliberately excluded -- see thomas_pi_multik_k5k10k15.yaml's
  # header (degenerate H0 birth axis; not a persistence-image-specific
  # issue, but keeping the same filtration grid on both sides of the
  # comparison matters more than testing rips here).
  - {name: dtm,  params: {k: 5,  q: 2.0, maxdim: 1}}
  - {name: dtm,  params: {k: 10, q: 2.0, maxdim: 1}}
  - {name: dtm,  params: {k: 15, q: 2.0, maxdim: 1}}

# Deliberately empty: betti_multik computes Betti/Euler curves on the fly
# from diagrams.pkl (always written by scripts/featurize.py regardless of
# this list), calibrated fresh per seed on that seed's train rows only --
# see betti_multik.py's module docstring. No precomputed features file.
features: []

method:
  name: betti_multik
  params:
    homology_dims: [0, 1]
    # include_euler: false -- drops the derived chi(t) = beta_0(t) -
    # beta_1(t) channel, leaving just the two beta_d(t) curves stacked
    # (the direct pi_multik-style comparison, one channel per homology
    # dim, no derived combination). Replaces the earlier include_euler:
    # true (implicit default) results, which were deleted from
    # results/thomas/dtm_k5+10+15/betti_multik/ and pruned from
    # results/experiments.jsonl -- this run occupies the same results
    # path, not a new one.
    include_euler: false
    include_entropy: false
    # Betti-curve calibration -- fit here, per seed, on that seed's train
    # split only (see experiments/pi_multik/betti_multik.py's module
    # docstring). grid_size is the "128 sample vector" the per-k Conv1D
    # branch (encoders/sequence_bank.py) reads.
    grid_size: 128
    pd_calibration_coverage: 0.95

    embedding_dim: 64
    dropout: 0.2

    head_hidden_dims: [64, 32]
    head_dropout: 0.1

    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 50

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, mean_offspring, cluster_scale]
use_adversarial: true
