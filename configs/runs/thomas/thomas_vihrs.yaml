# thomas counterpart of nested_thomas/nested_thomas_vihrs.yaml -- vihrs
# reads clouds.pkl directly and computes L(r)-r itself, no filtration/
# features needed.

process:
  name: thomas
  seed: 0
  design:
    mode: random
    reps: 1
    random:
      n_param_vectors: 8000
      ranges:
        K:  {low: 15.0,  high: 120.0, scale: log}
        EN: {low: 150.0, high: 800.0, scale: log}
        c:  {low: 0.10,  high: 0.90,  scale: log}
      derived:
        parent_intensity: "K"
        mean_offspring:   "EN / K"
        cluster_scale:    "c / (2 * sqrt(K))"
        c1:               "2 * cluster_scale * sqrt(parent_intensity)"
      constraints:
        - "mean_offspring >= 2.5"
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

method:
  name: vihrs
  params:
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    checkpoint_best: true
    early_stopping_patience: 30

seeds: [9371, 9372, 9373]
target_label_names: [parent_intensity, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, mean_offspring, cluster_scale]
use_adversarial: true
