# Thomas process -> DTM (k=5) filtration -> Betti curves (H0+H1) -> CNN regressor.
# Matches the design already present under data/thomas/ (generate.py/featurize.py
# will skip recomputation and reuse it unless you pass --force).

process:
  name: thomas
  seed: 0
  design:
    mode: random
    reps: 8
    random:
      n_param_vectors: 5000
      ranges:
        parent_intensity: {low: 10.0, high: 200.0, scale: log}
        mean_offspring:   {low: 2.0,  high: 40.0,  scale: log}
        cluster_scale:    {low: 0.005, high: 0.1,  scale: log}
  adversarial:
    enabled: true
    fraction: 0.15
    seed_offset: 100000

filtration:
  - name: dtm
    params: {k: 5, q: 2.0, maxdim: 1}

features:
  - name: betti_curve
    params: {grid_size: 512, homology_dims: [0, 1]}

method:
  name: betti_cnn_01
  params:
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    embedding_dim: 64

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, mean_offspring, cluster_scale]
use_adversarial: true

# Try it:
#   python scripts/generate.py configs/runs/thomas_dtm_k5_betti_cnn.yaml
#   python scripts/featurize.py configs/runs/thomas_dtm_k5_betti_cnn.yaml
#   python scripts/train.py configs/runs/thomas_dtm_k5_betti_cnn.yaml --seed 9371
#   python scripts/evaluate.py configs/runs/thomas_dtm_k5_betti_cnn.yaml \
#       --methods betti_cnn_01 vihrs mincontrast fusion
#
# Switch components by editing one block, e.g. try a different filtration:
#   filtration: [{name: rips, params: {maxdim: 1}}]
# or a different process:
#   process: {name: matern, seed: 0, design: {...}}
# or a different method:
#   method: {name: pi_1, params: {batch_size: 32, n_epochs: 500, lr: 0.001, embedding_dim: 64}}
