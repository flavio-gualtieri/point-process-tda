# python scripts/train.py configs/runs/thomas/thomas_pi_multik_k5k10k15.yaml --seed 9371
#
# Same process/design as thomas_pi_multik.yaml (mass-fraction m_values
# channels) but with fixed rips + DTM k=5,10,15 channels instead --
# sibling-file convention mirrors
# configs/runs/nested_thomas/nested_thomas_pi_multik_k5k10k15.yaml.
# k_values below are auto-derived from the filtration list (no
# method.params.m_values set), matching the multi-k convention.
#
# process.design is descriptive only (data/thomas/clouds.pkl already exists
# from thomas_pi_multik.yaml's own generate.py run -- this file's job is
# just to drive filtration:/features: against those same clouds via
# scripts/featurize.py / slurm/featurize_diagrams_slurm.py, both of which
# key data/thomas/ off process.name alone).

process:
  name: thomas
  seed: 0
  design:
    mode: random
    reps: 1
    random:
      n_param_vectors: 8000
      ranges:
        K:  {low: 15.0,  high: 120.0, scale: log}
        EN: {low: 150.0, high: 800.0, scale: log}
        c:  {low: 0.10,  high: 0.90,  scale: log}
      derived:
        parent_intensity: "K"
        mean_offspring:   "EN / K"
        cluster_scale:    "c / (2 * sqrt(K))"
        c1:               "2 * cluster_scale * sqrt(parent_intensity)"
      constraints:
        - "mean_offspring >= 2.5"
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

filtration:
  # rips deliberately excluded: its H0 birth axis is degenerate (every Rips
  # H0 feature is born at filtration value 0), which build_calibrated_imager
  # rejects outright ("H0 birth axis is degenerate; use a 1-D vectorizer") --
  # confirmed by running featurize.py against nested_thomas's identical
  # k5k10k15 config with rips included. pi_multik's channel format is
  # uniformly 2D persistence images, so rips isn't usable here regardless;
  # matches the k5/k10/k15-only name/request.
  - {name: dtm,  params: {k: 5,  q: 2.0, maxdim: 1}}
  - {name: dtm,  params: {k: 10, q: 2.0, maxdim: 1}}
  - {name: dtm,  params: {k: 15, q: 2.0, maxdim: 1}}

features:
  - name: persistence_image
    params: {resolution: 64, sigma_pixels: 0.75, homology_dims: [0, 1], pd_calibration_coverage: 0.95}

method:
  name: pi_multik
  params:
    homology_dims: [0, 1]
    include_entropy: false
    # Persistence-image calibration is now fit here, per seed, on that
    # seed's train split only (see experiments/pi_multik/pi_multik.py's
    # module docstring) -- mirrors features.persistence_image.params
    # above, which scripts/featurize.py still uses to precompute
    # diagrams/persistence_image.pkl for other, non-pi_multik methods.
    resolution: 64
    sigma_pixels: 0.75
    pd_calibration_coverage: 0.95

    embedding_dim: 64
    conv_channels: [32, 64, 128]
    dropout: 0.2
    pool_type: avg

    head_hidden_dims: [64, 32]
    head_dropout: 0.1

    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 50

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, mean_offspring, cluster_scale]
use_adversarial: true
