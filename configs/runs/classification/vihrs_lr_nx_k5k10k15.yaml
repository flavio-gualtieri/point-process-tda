# python scripts/train.py configs/runs/classification/vihrs_lr_nx_k5k10k15.yaml --seed 9371
#
# Process CLASSIFICATION with the vihrs baseline adapted to classification:
# Ripley's isotropic-edge-corrected L(r)-r curve + point count n(x)
# -> Vihrs (2022) 1-D CNN (Figure 1) -> 5-way softmax over the point-process
# family. This is the classical-second-order-statistic counterpart of the
# pi_multik classify run (slurm/pi_multik_classify_h0h1.sh): SAME clouds,
# SAME 5 seeds, SAME train/val/test split -- only the feature set (a single
# radially-averaged summary function vs. multi-k 2-D persistence images) and
# the network differ, so the two results.json's compare directly.
#
# Classes (index == position below, == data/classification/*'s label_names):
#   0 aniso_thomas   1 matern_cluster   2 nested_thomas   3 strauss   4 thomas
# lgcp / lgcp_strauss deliberately excluded (see classification_manifest.yaml).
#
# vihrs needs NO filtration/diagrams of its own -- it computes L(r)-r
# straight from clouds.pkl. The `filtration:` block below is consumed ONLY
# to locate the per-k diagram bundles whose seed intersection defines
# pi_multik's split; vihrs reads their `seeds`/`labels` arrays (never the
# diagrams) so it trains and tests on exactly the same clouds. It MUST match
# the pi_multik classify config's filtration block.
#
# Data layout consumed (process.name == "classification"):
#   data/classification/clouds.pkl, adversarial_clouds.pkl
#   data/classification/dtm_k{5,10,15}/{,adversarial_}diagrams.pkl   (seeds/labels only)
# L(r)-r features are cached to data/classification/{,adversarial_}clouds.lfunc_classify_cache.npz
# (~1.8 min to build for 35k clouds; every seed after the first reuses it).
#
# Results path (no --run-tag): results/classification/raw/vihrs/seed_<seed>/

process:
  name: classification
  seed: 0

filtration:
  - {name: dtm, params: {k: 5,  q: 2.0, maxdim: 1}}
  - {name: dtm, params: {k: 10, q: 2.0, maxdim: 1}}
  - {name: dtm, params: {k: 15, q: 2.0, maxdim: 1}}

method:
  name: vihrs
  params:
    task: classify            # -> CrossEntropyLoss + accuracy / per-class recall

    # L(r)-r grid: spatstat Kest/Lest geometric defaults for the unit square
    # (rmax = side/4, 513 points) -- see baselines/vihrs.py's module docstring.
    r_max: 0.25
    n_r: 513

    # Training budget matched to the pi_multik classify run for a fair
    # feature-vs-feature comparison. vihrs keeps the paper's plain-Adam
    # optimizer (pi_multik uses AdamW, weight_decay 3e-4 -- set weight_decay
    # below to match exactly if that difference matters). Always checkpoints
    # + early-stops on val cross-entropy, like every trained method here.
    batch_size: 128
    n_epochs: 200
    lr: 0.001
    weight_decay: 0.0
    early_stopping_patience: 30

seeds: [9371, 9372, 9373, 9374, 9375]

# Ordered CLASS names (index i == class i), asserted equal to the diagram
# bundle's own label_names.
target_label_names: [aniso_thomas, matern_cluster, nested_thomas, strauss, thomas]

use_adversarial: true
