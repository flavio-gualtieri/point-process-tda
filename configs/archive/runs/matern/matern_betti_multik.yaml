# Matern (hard-core type II) -> DTM (k=5,10,15) Betti curves + Euler
# characteristic -> betti_multik regression. Betti-curve/Euler-
# characteristic sibling of configs/runs/matern/matern_pi_multik.yaml --
# identical process/design/filtration/seeds/split, so the two are directly
# comparable (see experiments/pi_multik/betti_multik.py's module
# docstring). Data built separately via
# scripts/generate.py configs/runs/matern/matern_pi_multik.yaml (same
# process.name/seed/design as that file -- this config just drives
# filtration:/scripts/featurize.py against the same clouds).

process:
  name: matern
  seed: 47
  design:
    mode: random
    reps: 4  # replicate draws per sampled param vector
    random:
      n_param_vectors: 2000
      ranges:
        # Region is the unit square (volume 1), so these are absolute units.
        parent_intensity: {low: 100.0, high: 1000.0, scale: log}
        hardcore_radius: {low: 0.012, high: 0.04,   scale: log}
  adversarial:
    enabled: true
    fraction: 0.125       # share of clouds held out as the adversarial (OOD) split
    seed_offset: 100000   # keeps adversarial cloud seeds disjoint from train/test

filtration:
  - {name: dtm, params: {k: 5,  q: 2.0, maxdim: 1}}   # k = neighbors for the DTM density estimate
  - {name: dtm, params: {k: 10, q: 2.0, maxdim: 1}}
  - {name: dtm, params: {k: 15, q: 2.0, maxdim: 1}}

# Deliberately empty: betti_multik computes Betti/Euler curves on the fly
# from diagrams.pkl, calibrated fresh per seed on that seed's train rows
# only -- see betti_multik.py's module docstring. No precomputed features
# file (unlike matern_pi_multik.yaml's persistence_image entry).
features: []

method:
  name: betti_multik
  params:
    batch_size: 32
    n_epochs: 500
    lr: 0.001
    embedding_dim: 64
    early_stopping_patience: 30  # stop after this many epochs with no val_loss improvement
    # k_values auto-derived from the filtration list above; override to fuse a subset, e.g. k_values: [5, 15]
    # matern_pi_multik.yaml's legacy use_fusion: true shorthand isn't
    # supported here -- betti_multik always reads the modern, explicit
    # fusion_mode/fusion_pool keys, spelled out below to reproduce the same
    # architecture choice (Conv1d-over-k, avg-pooled) for a fair comparison.
    fusion_mode: conv
    fusion_pool: avg
    # Betti-curve calibration -- fit here, per seed, on that seed's train
    # split only (see experiments/pi_multik/betti_multik.py's module
    # docstring).
    grid_size: 128
    homology_dims: [0, 1]
    pd_calibration_coverage: 0.99

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, hardcore_radius]  # targets to regress -- the only two params MaternHardCoreProcess exposes
log_label_names: [parent_intensity, hardcore_radius]     # both swept on a log scale -- log-transform before z-scoring
use_adversarial: true
