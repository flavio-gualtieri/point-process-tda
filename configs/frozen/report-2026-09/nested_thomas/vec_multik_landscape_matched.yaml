# python scripts/train.py configs/runs/nested_thomas/vec_multik_landscape_matched.yaml --seed 9371 --run-tag matched
#
# vectorization=landscape, encoder_path=native, matched feature budget:
# K=8, G=512 -> 4096 per (dim, scale), same budget as the 64x64
# persistence images. K is fixed (not left to the coverage rule) so this
# arm's feature_dim matches the image baseline exactly; the coverage
# rule's own answer is still computed and logged (see choose_K's
# docstring) even though this run doesn't use it. --run-tag matched is
# REQUIRED: this file and vec_multik_landscape_native.yaml share the same
# (vectorization, encoder_path) subdir name (VectorizedMultiKExperiment.subdir
# doesn't encode G/K/feature_dim -- see vectorized_multik.py) and would
# silently overwrite each other's results without it.
#
# nested_thomas sibling of configs/runs/thomas/vec_multik_landscape_matched.yaml
# -- same method.params, process/design block copied from
# configs/runs/nested_thomas/vec_multik_landscape_native.yaml.

process:
  name: nested_thomas
  seed: 0
  design:
    mode: random
    reps: 1
    random:
      n_param_vectors: 8000
      ranges:
        K:   {low: 15.0,  high: 120.0, scale: log}
        mu1: {low: 1.5,   high: 7.0,   scale: log}
        EN:  {low: 150.0, high: 800.0, scale: log}
        c1:  {low: 0.10,  high: 0.90,  scale: log}
        c2:  {low: 0.03,  high: 0.35,  scale: log}
      derived:
        meta_parent_intensity: "K"
        meta_offspring:        "mu1"
        mean_offspring:        "EN / (K * mu1)"
        meta_cluster_scale:    "c1 / (2 * sqrt(K))"
        cluster_scale:         "c2 / (2 * sqrt(K * mu1))"
      constraints:
        - "mean_offspring >= 2.5"
        - "meta_cluster_scale / cluster_scale >= 3"
        - "meta_cluster_scale / cluster_scale <= 12"
  adversarial:
    enabled: true
    fraction: 0.125
    seed_offset: 100000

filtration:
  - {name: dtm,  params: {k: 5, q: 2.0, maxdim: 1}}
  - {name: dtm,  params: {k: 10, q: 2.0, maxdim: 1}}
  - {name: dtm,  params: {k: 15, q: 2.0, maxdim: 1}}

features: []

method:
  name: vec_multik
  params:
    vectorization: landscape
    encoder_path: native

    G: 512
    K: 8
    homology_dims: [0, 1]
    include_entropy: false
    pd_calibration_coverage: 0.95

    head_hidden_dims: [64, 32]
    head_dropout: 0.1

    batch_size: 32
    n_epochs: 500
    lr: 0.001
    weight_decay: 0.0003
    early_stopping_patience: 50

    embedding_dim: 64
    conv_channels: [32, 64, 128]
    dropout: 0.2
    pool_type: avg

seeds: [9371, 9372, 9373, 9374, 9375, 9376, 9377, 9378, 9379, 9380]
target_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
log_label_names: [parent_intensity, meta_offspring, meta_cluster_scale, mean_offspring, cluster_scale]
use_adversarial: true
