# Smoke run (SMOKE=1 bash slurm/run_all.sh): merged over configs/simulation.yaml, key by key.
# Every 100th theta of the paper bank -- the same streams, so these patterns are bit-for-bit rows of
# the full bank -- which still leaves train (70), val (10) and test (120) thetas per family.
thetas: 20000
stride: 100
shard_size: 50
